<div id="world-history-modal" class="modal-overlay" style="display: none;">
  <div class="modal-dialog world-history-dialog">
    <div class="world-history-title">
      <span data-i18n="templates.history.title">World History</span>
      <button type="button" class="modal-close" id="world-history-close" aria-label="Close">×</button>
    </div>
    <div class="world-history-content">
      <p data-i18n="templates.history.intro">Chronicle of this world:</p>
      <ul class="world-history-list" id="world-history-list"></ul>
      <p class="world-history-empty" id="world-history-empty" style="display: none;" data-i18n="templates.history.empty">
        No events recorded yet.
      </p>
    </div>
    <div class="modal-buttons">
      <button type="button" class="modal-button primary" id="world-history-ok" data-i18n="dialogs.ok">OK</button>
    </div>
  </div>
</div>
