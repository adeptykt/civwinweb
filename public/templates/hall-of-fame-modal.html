<div id="hall-of-fame-modal" class="modal-overlay" style="display: none;">
  <div class="modal-dialog hall-of-fame-dialog">
    <div class="hall-of-fame-title">
      <span data-i18n="templates.hallOfFame.title">Hall of Fame</span>
      <button type="button" class="modal-close" id="hall-of-fame-close" aria-label="Close">×</button>
    </div>
    <div class="hall-of-fame-content">
      <p class="hall-of-fame-intro" data-i18n="templates.hallOfFame.intro">Your five greatest civilizations:</p>
      <ol class="hall-of-fame-list" id="hall-of-fame-list"></ol>
      <p class="hall-of-fame-empty" id="hall-of-fame-empty" style="display: none;" data-i18n="templates.hallOfFame.empty">
        No civilizations have qualified yet. Conquer the world to enter the Hall of Fame!
      </p>
    </div>
    <div class="modal-buttons">
      <button type="button" class="modal-button" id="hall-of-fame-clear" data-i18n="templates.hallOfFame.clear">Clear</button>
      <button type="button" class="modal-button primary" id="hall-of-fame-ok" data-i18n="dialogs.ok">OK</button>
    </div>
  </div>
</div>
