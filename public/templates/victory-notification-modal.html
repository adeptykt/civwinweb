<div id="victory-notification-modal" class="modal-overlay" style="display: none;">
  <div class="modal-dialog victory-notification-dialog">
    <div class="victory-notification-title">
      <span data-i18n="templates.victory.title">Victory!</span>
      <button type="button" class="modal-close" id="victory-notification-close" aria-label="Close">×</button>
    </div>
    <div class="victory-notification-content">
      <p class="victory-text" id="victory-message-text"></p>
      <div class="victory-score-breakdown" id="victory-score-breakdown"></div>
      <p class="victory-hof-note" id="victory-hof-note" style="display: none;"></p>
    </div>
    <div class="modal-buttons">
      <button type="button" class="modal-button" id="victory-hof-btn" data-i18n="templates.victory.viewHallOfFame">Hall of Fame</button>
      <button type="button" class="modal-button" id="victory-history-btn" data-i18n="templates.victory.viewHistory">History</button>
      <button type="button" class="modal-button" id="victory-continue-btn" data-i18n="templates.victory.continuePlaying">Continue Playing</button>
      <button type="button" class="modal-button primary" id="victory-exit-btn" data-i18n="templates.victory.exitToMenu">Main Menu</button>
    </div>
  </div>
</div>
